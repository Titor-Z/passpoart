<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Passpoart 应用图标：品牌盾牌（与解锁页 .logo 同语言：primary→lavender 对角渐变 + 顶部高光） -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4739D"/>
      <stop offset="1" stop-color="#9B7FDF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底板：全幅圆角方（macOS 连续圆角近似 rx≈18%） -->
  <rect x="0" y="0" width="1024" height="1024" rx="184" fill="url(#brand)"/>
  <!-- 顶部高光（上半个圆角矩形裁进底板） -->
  <path d="M0 184 a184 184 0 0 1 184-184 h656 a184 184 0 0 1 184 184 v328 H0 Z" fill="url(#gloss)"/>

  <!-- 盾牌 + 对勾：icons/shield.svg（18×18 stroke 1.3）放大居中，白色描线 -->
  <g transform="translate(512 512) scale(31.5) translate(-9 -9)"
     fill="none" stroke="#FFFFFF" stroke-width="1.3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 2.5l5.5 2.2v4c0 3.4-2.2 5.8-5.5 7.3-3.3-1.5-5.5-3.9-5.5-7.3v-4L9 2.5z"/>
    <path d="M6.8 8.9l1.6 1.6 3-3.3"/>
  </g>
</svg>
