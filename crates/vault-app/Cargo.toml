[package]
name = "vault-app"
version.workspace = true
edition.workspace = true
description = "Passpoart 桌面壳：gpui-ce 420×640 玻璃小窗（UI 层唯一允许依赖 gpui 的 crate）。"

[[bin]]
name = "passpoart"
path = "src/main.rs"

[dependencies]
# —— UI 层：gpui-ce（与 ~/rili、~/glowlink 同款技术栈）——
# `font-kit` 必须开：不开的话窗口、布局、色块都正常，但一个字都不显示。
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui_ce_platform = { version = "0.1.0", features = ["font-kit"] }

# gpui 的字体/渲染问题会把原因直接打进日志，没它 RUST_LOG 是空转。
env_logger = "0.11"
log = "0.4"

# —— 加密与存储：解锁走 vault-core（UI 层不直接碰 nodblite）——
vault-core = { workspace = true }
# —— 自维护输入组件库 ——
vault-ui = { workspace = true }

# —— 应用配置（~/.passpoart/config.json：关闭按钮行为等）——
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# —— 自绘窗口控制：把 macOS 系统红绿灯真正藏掉（与 glowlink 同款）——
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWindow",
    "NSView",
    "NSButton",
    "NSControl",
] }
