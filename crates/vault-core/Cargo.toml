[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
description = "Passpoart 核心库：模型、加密、存储、同步抽象。零 IO、零 UI 依赖。"

[lib]
name = "vault_core"
path = "src/lib.rs"

[dependencies]
# 加密四件套（计划书第 5 节选型，全部 RustCrypto 系、经过审计）：
# KDF：Argon2id（抗 GPU/ASIC）
argon2 = "0.5"
# AEAD：XChaCha20-Poly1305（24B 大 nonce，不易复用；纯软件也快）
chacha20poly1305 = "0.10"
# TOTP 展示层（RFC 6238）：HMAC-SHA1 用 RustCrypto 实现，不手搓密码学
hmac = "0.12"
sha1 = "0.10"
# 子密钥派生（context 域分离）与完整性哈希
blake3 = "1"
# 密钥/明文缓冲 drop 时清零
zeroize = "1"

# 本地存储：自研单文件 NoSQL（文档模型 + redb 纯 Rust ACID 底座）。
# 选型见 docs/Taolun.md TL20261025T191400 与存储决策讨论：可审计、文档模型天然匹配、单文件即备份。
# 上游：github.com/Titor-Z/nosqlite（包名 nodblite）；rev 钉死当前同步的上游 commit。
nodblite = { git = "https://github.com/Titor-Z/nosqlite", rev = "8f851eaadcf978c0a25f9097f3cd2a9d70cbdeee" }
# 条目与 KDF 参数的 JSON 序列化（加密前的明文形态规范化）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
